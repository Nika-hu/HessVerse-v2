<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材巡迴展 - 老師專屬闖關集點卡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        :root {
            --planet-yellow: #FFF3A7;
            --planet-purple: #DCD6F7;
            --planet-blue: #A6E3E9;
            --primary-accent: #7B61FF;
            --secondary-accent: #FF6B8B;
            --gold-accent: #FFB800;
            --bg-grad: linear-gradient(180deg, #E6F4FE 0%, #F5F0FF 50%, #FFF5FB 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #344054;
            --text-sub: #667085;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Fredoka', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            padding-bottom: 50px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 繪本星球插圖主題背景 */
        .planet-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%);
            width: 100%;
            max-width: 680px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 15px 30px rgba(123, 97, 255, 0.25));
            animation: floatPlanet 14s ease-in-out infinite alternate;
        }

        @keyframes floatPlanet {
            0% { transform: translate(-50%, -46%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -48%) rotate(2.5deg) scale(1.03); }
            100% { transform: translate(-50%, -44%) rotate(-2deg) scale(0.98); }
        }

        /* 背景可愛漂浮裝飾雲朵與星光 */
        .bg-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            filter: blur(1px);
            animation: float 8s ease-in-out infinite alternate;
        }

        .cloud-1 { width: 140px; height: 45px; top: 40px; left: -20px; }
        .cloud-2 { width: 180px; height: 55px; top: 120px; right: -30px; animation-delay: -3s; }
        .cloud-3 { width: 120px; height: 40px; top: 350px; left: -10px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(12px) translateX(10px); }
        }

        header {
            background: linear-gradient(135deg, #8A7CFB 0%, #A294FF 40%, #E29BF7 100%);
            color: white;
            padding: 30px 20px 48px;
            text-align: center;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            box-shadow: 0 10px 25px rgba(138, 124, 251, 0.25);
            position: relative;
            z-index: 1;
        }

        .header-title-container {
            display: inline-block;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(90, 60, 160, 0.3);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.95;
            background: rgba(255, 255, 255, 0.25);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 700;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 18px;
            position: relative;
            z-index: 1;
        }

        /* 進度卡片 (星球風格) */
        .progress-card {
            background: var(--card-bg);
            margin-top: -30px;
            border-radius: var(--border-radius);
            padding: 18px 22px;
            box-shadow: 0 12px 30px rgba(123, 97, 255, 0.12);
            border: 3px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .progress-info {
            flex-grow: 1;
            margin-right: 16px;
        }

        .progress-title-wrap {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 900;
            color: #4A3E7D;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: #EFE8FF;
            height: 14px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
            padding: 2px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #70E2D2, #7B61FF, #FF6B8B);
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .redeem-btn {
            background: #E0E0E0;
            color: #999;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 0.88rem;
            cursor: not-allowed;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0px #CCCCCC;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .redeem-btn.active {
            background: linear-gradient(135deg, #FFB800 0%, #FF8A00 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0px #D67300, 0 8px 15px rgba(255, 138, 0, 0.4);
            animation: bounce 1.2s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

        .section-title {
            font-size: 1.15rem;
            margin: 24px 0 14px;
            font-weight: 900;
            color: #3E3068;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '🪐';
            font-size: 1.2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(140, 130, 200, 0.08);
            border: 2px solid #FFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(123, 97, 255, 0.15);
        }

        .card:active {
            transform: scale(0.96);
        }

        .card-tag {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        /* 搭配星球分類色彩 */
        .tag-life { background: #FFE8A3; color: #8A5B00; }     /* 生活星球黃 */
        .tag-picture { background: #EBD9FF; color: #622CA7; }  /* 繪本星球紫 */
        .tag-literacy { background: #CBEFEE; color: #0C6967; } /* 素養星球藍 */
        .tag-service { background: #FFD4E2; color: #9E1F47; }  /* 獨家服務粉 */

        .card h3 {
            font-size: 0.95rem;
            font-weight: 900;
            color: #2D2350;
            margin-bottom: 4px;
        }

        .card p {
            font-size: 0.76rem;
            color: var(--text-sub);
            line-height: 1.35;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .stamp-box {
            height: 70px;
            border: 2.5px dashed #D3C9F0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(248, 245, 255, 0.6);
            transition: all 0.3s ease;
            position: relative;
        }

        .stamp-box.stamped {
            border-style: solid;
            border-color: #7B61FF;
            background: linear-gradient(135deg, rgba(255, 235, 240, 0.6) 0%, rgba(230, 225, 255, 0.6) 100%);
        }

        .stamp-mark {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotate(-12deg) scale(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            opacity: 0;
            user-select: none;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.25);
            background: #FFF;
            border: 3px double #FF5277;
            color: #FF5277;
        }

        .stamp-mark svg {
            width: 24px;
            height: 24px;
            fill: #FF5277;
        }

        .stamp-mark span {
            font-size: 0.65rem;
            font-weight: 900;
            margin-top: 1px;
        }

        .stamp-box.stamped .stamp-mark {
            transform: rotate(-12deg) scale(1);
            opacity: 1;
        }

        /* Modals (可愛繪本風彈窗) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 35, 80, 0.55);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 28px 24px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(45, 35, 80, 0.25);
            transform: translateY(30px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid #F0EBFF;
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .modal h2 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #332463;
            margin-bottom: 6px;
        }

        .modal p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 18px;
            line-height: 1.4;
            font-weight: 500;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            font-size: 1.4rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 6px;
            border: 2.5px solid #D8CEF6;
            border-radius: 16px;
            margin-bottom: 18px;
            outline: none;
            background: #FAF8FF;
            color: #7B61FF;
            transition: border-color 0.2s;
        }

        .password-input:focus {
            border-color: #7B61FF;
            background: #FFF;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 18px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8A7CFB 0%, #7B61FF 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(123, 97, 255, 0.35);
        }

        .btn-secondary {
            background: #F0EDF9;
            color: #615293;
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF6B8B 0%, #FF5277 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 82, 119, 0.35);
        }

        /* 可愛兌獎憑證區 */
        .gift-voucher {
            background: linear-gradient(135deg, #FFF6E5 0%, #FFEFCF 100%);
            border: 2px dashed #FFB800;
            border-radius: 20px;
            padding: 16px;
            margin: 0 auto 18px;
            position: relative;
        }

        .gift-voucher-code {
            font-size: 1.2rem;
            font-weight: 900;
            color: #D67300;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .reset-link {
            display: block;
            margin-top: 28px;
            text-align: center;
            font-size: 0.78rem;
            color: #9C8EB9;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 700;
        }

        /* 自訂可愛 Toast */
        .toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #FF5277;
            color: white;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 900;
            box-shadow: 0 8px 20px rgba(255, 82, 119, 0.35);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3);
            z-index: 200;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- 主題繪本星球背景底圖 -->
    <svg class="planet-bg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 星球本體三色立體漸層 (繪本風) -->
            <radialGradient id="planetBodyGrad" cx="42%" cy="38%" r="58%">
                <stop offset="0%" stop-color="#FFF9C4"/>
                <stop offset="35%" stop-color="#F5B4F8"/>
                <stop offset="70%" stop-color="#9A75FA"/>
                <stop offset="100%" stop-color="#5B45C6"/>
            </radialGradient>

            <!-- 前星環漸層 -->
            <linearGradient id="ringGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#FF80AB" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#B388FF" stop-opacity="0.95"/>
            </linearGradient>

            <!-- 後星環漸層 -->
            <linearGradient id="ringGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.4"/>
            </linearGradient>

            <filter id="softGlow">
                <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- 星球後方閃耀星光顆粒 -->
        <g fill="#FFF" opacity="0.6">
            <circle cx="100" cy="180" r="4" />
            <circle cx="600" cy="220" r="5" />
            <circle cx="140" cy="520" r="6" />
            <circle cx="580" cy="480" r="4" />
        </g>

        <!-- 後半部星環 (位在星球下方) -->
        <g transform="rotate(-18 350 350)">
            <ellipse cx="350" cy="350" rx="310" ry="75" fill="none" stroke="url(#ringGradBack)" stroke-width="22" opacity="0.5"/>
            <ellipse cx="350" cy="350" rx="275" ry="60" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.4"/>
        </g>

        <!-- 主星球本體 -->
        <circle cx="350" cy="350" r="215" fill="url(#planetBodyGrad)" filter="url(#softGlow)" />

        <!-- 可愛隕石坑與地貌紋路 (生活與繪本風格) -->
        <g opacity="0.28" fill="#5239A0">
            <circle cx="270" cy="260" r="32" />
            <circle cx="260" cy="252" r="26" fill="#FFF" opacity="0.15" />
            
            <circle cx="380" cy="220" r="20" />
            
            <circle cx="430" cy="390" r="45" />
            <circle cx="418" cy="380" r="36" fill="#FFF" opacity="0.15" />

            <circle cx="230" cy="420" r="25" />
        </g>

        <!-- 星球亮面可愛微光弧 -->
        <path d="M 200 210 A 200 200 0 0 1 450 180" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.4" />

        <!-- 前半部星環 (穿過星球前方，營造立體感) -->
        <g transform="rotate(-18 350 350)">
            <path d="M 40 350 A 310 75 0 0 0 660 350" fill="none" stroke="url(#ringGradFront)" stroke-width="22" stroke-linecap="round" />
            <path d="M 75 350 A 275 60 0 0 0 625 350" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" />
        </g>

        <!-- 星球周圍可愛雲朵與星星裝飾 -->
        <!-- 左上方立體繪本雲 -->
        <g fill="#FFFFFF" opacity="0.9" transform="translate(110, 160)">
            <path d="M 20 20 Q 35 0 55 10 Q 75 -5 95 15 Q 115 15 110 35 Q 115 55 90 55 Q 75 65 55 55 Q 35 60 20 45 Q 0 35 20 20 Z" />
        </g>
        <!-- 右下方漂浮小雲 -->
        <g fill="#FFFFFF" opacity="0.85" transform="translate(480, 430)">
            <path d="M 15 15 Q 25 0 40 8 Q 55 -3 70 10 Q 85 10 80 25 Q 85 40 65 40 Q 55 48 40 40 Q 25 45 15 32 Q 0 25 15 15 Z" />
        </g>

        <!-- 四角閃耀星星 -->
        <path d="M 190 140 L 196 160 L 216 166 L 196 172 L 190 192 L 184 172 L 164 166 L 184 160 Z" fill="#FFE082" />
        <path d="M 520 230 L 524 245 L 539 249 L 524 253 L 520 268 L 516 253 L 501 249 L 516 245 Z" fill="#FF80AB" />
        <path d="M 210 490 L 214 502 L 226 506 L 214 510 L 210 522 L 206 510 L 194 506 L 206 502 Z" fill="#A7FFEB" />
        <path d="M 480 160 L 483 170 L 493 173 L 483 176 L 480 186 L 477 176 L 467 173 L 477 170 Z" fill="#FFF" />
    </svg>

    <!-- 背景裝飾雲朵 -->
    <div class="bg-decor">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <header>
        <div class="header-title-container">
            <h1>2026 全新領域教材展示會</h1>
            <p>探索創新星球資源 • 集滿 9 關領好禮</p>
        </div>
    </header>

    <div class="container">
        <!-- 進度條 -->
        <div class="progress-card">
            <div class="progress-info">
                <div class="progress-title-wrap">
                    <span>🚀 探索進度</span>
                    <span id="progress-text">0 / 9</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
            <button class="redeem-btn" id="redeem-btn" onclick="openRedeemModal()">
                🎁 兌換好禮
            </button>
        </div>

        <!-- 9 個關卡卡片 -->
        <div class="section-title">星球體驗區</div>
        <div class="grid" id="card-grid"></div>

        <span class="reset-link" onclick="openResetModal()">⚙️ 重置集點紀錄（僅供測試）</span>
    </div>

    <!-- 密碼輸入彈窗 -->
    <div class="modal-overlay" id="pw-modal">
        <div class="modal">
            <div class="modal-icon">🗝️</div>
            <h2 id="pw-modal-title">關卡驗證</h2>
            <p>請由現場關主工作人員輸入密碼完成蓋章：</p>
            <input type="number" id="pw-input" class="password-input" placeholder="0000" pattern="\d*" inputmode="numeric">
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closePwModal()">取消</button>
                <button class="btn btn-primary" onclick="verifyPassword()">確認蓋章</button>
            </div>
        </div>
    </div>

    <!-- 兌獎彈窗 -->
    <div class="modal-overlay" id="redeem-modal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2>恭喜完成全區體驗！</h2>
            <p>請向服務台出示此兌換卡領取精美好禮！</p>
            <div class="gift-voucher">
                <div style="font-size: 0.8rem; color: #B36B00; font-weight: 700;">VIP 專屬選書贈禮憑證</div>
                <div class="gift-voucher-code">#2026-TEACHER-888</div>
            </div>
            <button class="btn btn-secondary" style="width: 100%;" onclick="closeRedeemModal()">開心收下</button>
        </div>
    </div>

    <!-- 重置確認彈窗 -->
    <div class="modal-overlay" id="reset-modal">
        <div class="modal">
            <div class="modal-icon">🧹</div>
            <h2>確定要重置進度嗎？</h2>
            <p>重置後將清空目前所有已獲得的星球章。</p>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeResetModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmResetStamps()">確定重置</button>
            </div>
        </div>
    </div>

    <!-- Toast 訊息提示 -->
    <div class="toast" id="toast-msg">❌ 密碼錯誤，請重新詢問現場工作人員！</div>

    <script>
        // 9 個關卡資料
        const zones = [
            { title: "數位研究室", tag: "生活星球", tagClass: "tag-life", desc: "數位新品、AI工具分享", pw: "101", icon: "star" },
            { title: "教學補給站", tag: "繪本星球", tagClass: "tag-picture", desc: "教具展示", pw: "102", icon: "book" },
            { title: "繪本星球", tag: "素養星球", tagClass: "tag-literacy", desc: "Wow Story與Wow Story Phonics", pw: "201", icon: "sparkle" },
            { title: "素養星球", tag: "素養星球", tagClass: "tag-literacy", desc: "Super Fun", pw: "202", icon: "crown" },
            { title: "生活星球", tag: "生活星球", tagClass: "tag-life", desc: "Fun World", pw: "301", icon: "clover" },
            { title: "節慶小屋", tag: "繪本星球", tagClass: "tag-picture", desc: "實體Padlet+主題骰子", pw: "302", icon: "heart" },
            { title: "星際摩天輪", tag: "獨家服務", tagClass: "tag-service", desc: "實體&數位字母轉盤", pw: "401", icon: "gift" },
            { title: "太空小幫手", tag: "獨家服務", tagClass: "tag-service", desc: "學力檢測+Padlet Arcade", pw: "402", icon: "sun" },
            { title: "Hess小舖", tag: "獨家服務", tagClass: "tag-service", desc: "點心兌換", pw: "501", icon: "gift" }
        ];

        // 各關卡對應 SVG 印章圖案
        const stampIcons = {
            star: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
            book: `<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`,
            sparkle: `<svg viewBox="0 0 24 24"><path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg>`,
            crown: `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`,
            clover: `<svg viewBox="0 0 24 24"><path d="M12 10a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h3v-3zm0 0a3 3 0 0 0 3-3 3 3 0 0 0 3 3 3 3 0 0 0-3 3h-3v-3zm0 0a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0 3-3v-3zm0 0a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3v3z"/></svg>`,
            heart: `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
            gift: `<svg viewBox="0 0 24 24"><path d="M20 6h-3.17c.42-.62.67-1.37.67-2.2C17.5 2.1 16.1 1 14.5 1c-1.3 0-2.4.84-2.82 2h-.36C10.9 1.84 9.8 1 8.5 1 6.9 1 5.5 2.1 5.5 3.8c0 .83.25 1.58.67 2.2H3c-1.1 0-2 .9-2 2v3c0 .55.45 1 1 1h1v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8h1c.55 0 1-.45 1-1V8c0-1.1-.9-2-2-2z"/></svg>`,
            sun: `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>`
        };

        let currentSelectIndex = null;
        let stampedState = JSON.parse(localStorage.getItem('teacher_stamp_state')) || new Array(zones.length).fill(false);

        // 如果 LocalStorage 舊長度不符合關卡數則自動進行校正
        if (stampedState.length !== zones.length) {
            stampedState = new Array(zones.length).fill(false);
        }

        // 初始化渲染卡片
        function renderCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            zones.forEach((zone, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPwModal(i);

                const isStamped = stampedState[i];

                card.innerHTML = `
                    <div>
                        <div class="card-tag ${zone.tagClass}">${zone.tag}</div>
                        <h3>${i + 1}. ${zone.title}</h3>
                        <p>${zone.desc}</p>
                    </div>
                    <div class="stamp-box ${isStamped ? 'stamped' : ''}">
                        <div class="stamp-mark">
                            ${stampIcons[zone.icon] || stampIcons.star}
                            <span>已解鎖</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateUI();
        }

        // 開啟密碼彈窗
        function openPwModal(index) {
            if (stampedState[index]) return;
            currentSelectIndex = index;
            document.getElementById('pw-modal-title').innerText = `${index + 1}. ${zones[index].title}`;
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-modal').classList.add('active');
            setTimeout(() => document.getElementById('pw-input').focus(), 100);
        }

        function closePwModal() {
            document.getElementById('pw-modal').classList.remove('active');
            currentSelectIndex = null;
        }

        // Toast 訊息提示
        function showToast(message) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // 驗證關卡密碼
        function verifyPassword() {
            const inputPw = document.getElementById('pw-input').value.trim();
            const correctPw = zones[currentSelectIndex].pw;

            if (inputPw === correctPw) {
                stampedState[currentSelectIndex] = true;
                localStorage.setItem('teacher_stamp_state', JSON.stringify(stampedState));
                closePwModal();
                renderCards();
            } else {
                showToast("❌ 密碼錯誤，請重新詢問現場工作人員！");
                document.getElementById('pw-input').value = '';
            }
        }

        // 更新進度條與兌獎按鈕
        function updateUI() {
            const count = stampedState.filter(Boolean).length;
            const total = zones.length;

            const fill = document.getElementById('progress-fill');
            const text = document.getElementById('progress-text');
            const btn = document.getElementById('redeem-btn');

            fill.style.width = `${(count / total) * 100}%`;
            text.innerText = `${count} / ${total}`;

            if (count === total) {
                btn.classList.add('active');
                btn.removeAttribute('disabled');
            } else {
                btn.classList.remove('active');
                btn.setAttribute('disabled', 'true');
            }
        }

        function openRedeemModal() {
            const btn = document.getElementById('redeem-btn');
            if (btn.classList.contains('active')) {
                document.getElementById('redeem-modal').classList.add('active');
            }
        }

        function closeRedeemModal() {
            document.getElementById('redeem-modal').classList.remove('active');
        }

        function openResetModal() {
            document.getElementById('reset-modal').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.remove('active');
        }

        function confirmResetStamps() {
            localStorage.removeItem('teacher_stamp_state');
            stampedState = new Array(zones.length).fill(false);
            closeResetModal();
            renderCards();
        }

        // 支援 Enter 鍵提交密碼
        document.getElementById('pw-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });

        // 頁面載入時執行初始化
        renderCards();
    </script>
</body>
</html>
